services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: novara
      POSTGRES_PASSWORD: novara_dev
      POSTGRES_DB: novara_dev
    ports:
      - "5432:5432"
    volumes:
      - novara_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novara"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  novara_pgdata:
